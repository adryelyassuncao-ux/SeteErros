<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos 7 Erros</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <h1>Jogo dos 7 Erros - Parquinho</h1>
        <div class="painel-topo">
            <div class="placar">
                <p>Erros Encontrados: <span id="contador">0</span>/7</p>
            </div>
            <div class="cronometro">
                <p>⏱️ Tempo: <span id="tempo">00:00</span></p>
            </div>
            <button id="btn-dica" onclick="usarDica()" class="btn-dica">💡 Dica (<span id="qtd-dicas">3</span>)</button>
        </div>
    </header>

    <main class="container-jogo">
        <div id="caixa-esquerda" class="caixa-imagem">
            <img src="Imagem/Esquerda.jpg" alt="Imagem Original">
        </div>
        
        <div id="caixa-direita" class="caixa-imagem">
            <img src="Imagem/Direita.jpg" alt="Imagem com Erros">
        </div>
    </main>

    <!-- Janela Modal de Parabéns -->
    <div id="modal-vitoria" class="modal-escondida">
        <div class="modal-conteudo">
            <div class="modal-icone">🎉</div>
            <h2>Parabéns!</h2>
            <p>Encontraste todos os 7 erros do jogo!</p>
            <button onclick="reiniciarJogo()" class="btn-reiniciar">Jogar Novamente</button>
        </div>
    </div>

    <!-- Canvas para os Confetes -->
    <canvas id="canvas-confetes"></canvas>

    <script src="logica.js"></script>
</body>
</html>
